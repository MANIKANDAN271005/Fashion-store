{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Admin Panel{% endblock %} | Fashion Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body class="admin-body">

<div class="admin-layout">

    <aside class="admin-sidebar">

        <a href="{% url 'admin_dashboard' %}" class="admin-logo">
            <i class="fa-solid fa-shirt"></i>
            FashionStore <span>Admin</span>
        </a>

        <nav class="admin-nav">
            <a href="{% url 'admin_dashboard' %}" class="{% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
                <i class="fa-solid fa-gauge"></i> Dashboard
            </a>
            <a href="{% url 'admin_products' %}" class="{% if 'admin_product' in request.resolver_match.url_name %}active{% endif %}">
                <i class="fa-solid fa-box"></i> Products
            </a>
            <a href="{% url 'admin_categories' %}" class="{% if 'admin_categor' in request.resolver_match.url_name %}active{% endif %}">
                <i class="fa-solid fa-tags"></i> Categories
            </a>
        </nav>

        <div class="admin-sidebar-footer">
            <a href="{% url 'home' %}"><i class="fa-solid fa-arrow-left"></i> Back to Store</a>
            <a href="{% url 'logout' %}"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>

    </aside>

    <main class="admin-main">

        {% if messages %}
        <div class="mb-3">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block admin_content %}
        {% endblock %}

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/main.js' %}"></script>

</body>

</html>
