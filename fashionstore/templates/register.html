{% extends 'base.html' %}
{% load static %}

{% block title %}Register | Fashion Store{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-logo">
            <i class="fa-solid fa-shirt"></i>
            <h2>Create Account</h2>
            <p class="text-muted">Join Fashion Store in a few seconds</p>
        </div>

        <form method="POST" id="registerForm">
            {% csrf_token %}

            <label class="form-label">Full Name</label>
            <input type="text"
                   name="fullname"
                   class="form-control"
                   placeholder="Your full name"
                   required>

            <label class="form-label">Username</label>
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Choose a username"
                   required>

            <label class="form-label">Email</label>
            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="you@example.com"
                   required>

            <label class="form-label">Phone Number</label>
            <input type="text"
                   name="phone"
                   class="form-control"
                   placeholder="Optional">

            <label class="form-label">Register As</label>
            <select name="role" class="form-select role-select" required>
                <option value="" selected disabled>Select an account type</option>
                <option value="user">Customer</option>
                <option value="seller">Seller</option>
            </select>

            <label class="form-label">Password</label>
            <div class="password-wrapper">
                <input type="password"
                       name="password1"
                       id="password"
                       class="form-control"
                       placeholder="At least 6 characters"
                       required>
                <button type="button" id="togglePassword" tabindex="-1">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <label class="form-label">Confirm Password</label>
            <input type="password"
                   name="password2"
                   id="confirmPassword"
                   class="form-control"
                   placeholder="Re-enter your password"
                   required>

            <button type="submit" class="auth-btn mt-2">
                Create Account
            </button>

        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </div>

    </div>

</section>

{% endblock %}
