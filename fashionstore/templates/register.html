{% extends 'base.html' %}
{% load static %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header text-center bg-dark text-white">
                    <h3>Create Account</h3>
                </div>

                <div class="card-body">

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label>Full Name</label>
                            <input type="text"
                                   name="fullname"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Username</label>
                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Phone Number</label>
                            <input type="text"
                                   name="phone"
                                   class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Register As</label>
                            <select name="role" class="form-control" required>
                                <option value="">Select Role</option>
                                <option value="user">User</option>
                                <option value="seller">Seller</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label>Password</label>
                            <input type="password"
                                   name="password1"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Confirm Password</label>
                            <input type="password"
                                   name="password2"
                                   class="form-control"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Register
                        </button>

                    </form>

                    <div class="text-center mt-3">
                        Already have an account?
                        <a href="{% url 'login' %}">Login</a>
                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

{% endblock %}
