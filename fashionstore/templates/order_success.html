{% extends 'base.html' %}

{% block title %}Order Placed | Fashion Store{% endblock %}

{% block content %}

<section class="section">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-6">

<div class="panel text-center py-5">

    <span class="success-icon"><i class="fa-solid fa-check"></i></span>

    <h1 class="h2 mb-2">Thank You!</h1>

    <p class="text-muted mb-4">Your order has been placed successfully. We'll let you know when it ships.</p>

    <div class="d-flex flex-wrap justify-content-center gap-3">
        {% if user.is_authenticated %}
        <a href="{% url 'orders' %}" class="btn btn-outline-dark">View My Orders</a>
        {% endif %}
        <a href="{% url 'shop' %}" class="btn btn-dark">Continue Shopping</a>
    </div>

</div>

</div>

</div>

</div>

</section>

{% endblock %}
